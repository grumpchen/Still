name: Windows prerelease

on:
  push:
    branches:
      - agent/codex/leo3-deepseek-combined
    paths:
      - .github/workflows/windows-release.yml
    tags:
      - v0.*

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: still-desktop/pnpm-lock.yaml

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        working-directory: still-desktop
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: still-desktop
        run: pnpm check

      - name: Focused Files, assistant, canvas, and workspace tests
        working-directory: still-desktop
        run: pnpm exec tsx --test --test-concurrency=1 tests/files-browse-layout.test.mjs tests/files-preview-lifecycle.test.mjs tests/assistant-sidebar.test.mjs tests/assistant.test.mjs tests/canvas-add-tool-menu.test.mjs tests/minimize.test.mjs

      - name: Rust tests
        working-directory: still-desktop/src-tauri
        run: >-
          cargo test --bin still-desktop --
          --skip app_panel::tests::real_window_fixture_tracks_bounds_clips_native_content_and_releases_without_closing
          --skip native_resize::tests::managed_resize_blocks_edge_hit_testing_but_allows_still_sizes_and_restores_on_release

      - name: Build Windows executable
        working-directory: still-desktop
        run: pnpm tauri build --no-bundle

      - name: Prepare release asset and checksum
        id: release-asset
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v0.2366' }
          $version = $tag -replace '^v', ''
          $source = 'still-desktop/src-tauri/target/release/still-desktop.exe'
          $name = "ver$version.exe"
          Copy-Item $source "still-desktop/$name"
          $hash = (Get-FileHash "still-desktop/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-asset.outputs.tag }}
          name: Still ${{ steps.release-asset.outputs.tag }}
          prerelease: true
          files: still-desktop/${{ steps.release-asset.outputs.name }}
          body: |
            Still ${{ steps.release-asset.outputs.tag }} is a fix release based on v0.2365.

            Fixed the Files widget browse layout so the search field no longer squeezes the file list out of view.

            Windows x64 SHA-256: `${{ steps.release-asset.outputs.sha256 }}`

            TypeScript checks and focused assistant/canvas/workspace tests passed. Rust tests passed except for two real-window fixture tests skipped on the hosted runner because it does not provide the expected desktop window geometry. No live Windows GUI test was performed.
