name: Windows build
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: still-desktop/pnpm-lock.yaml
      - name: Install frontend test dependencies
        working-directory: still-desktop
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: still-workbench-e06f42f0e0ce712c63175d9f39b989b84b176020-windows-x64
          run-id: 45998766943
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify the candidate executable
        shell: pwsh
        run: |
          $actual = (Get-FileHash candidate/still-desktop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '27b3d0ab15d1381ff02bcbfd05f5e1c734306a4a94fc933e310f211fcb19539e') { throw "Unexpected executable hash $actual" }
          Write-Output $actual
      - name: Native Windows workbench smoke
        timeout-minutes: 5
        working-directory: still-desktop
        run: node scripts/windows-workbench-smoke.mjs --exe ../candidate/still-desktop.exe --artifact-dir ../artifacts/windows-smoke
      - name: Upload smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: still-smoke-replay-e06f42f
          path: artifacts/windows-smoke
          if-no-files-found: warn
