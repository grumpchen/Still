name: Publish verified workbench preview
on:
  push:
    branches: [agent/codex/workbench-feedback]
    paths: [.github/workflows/publish-workbench-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-still-workbench-preview-2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/grumpchen/Still/actions/runs/45959822577 > /tmp/candidate-run.json
          jq -e '.conclusion == "success" and .head_sha == "07289270349854b7edd305d02174070b9dc9438d"' /tmp/candidate-run.json
      - uses: actions/download-artifact@v4
        with:
          name: still-workbench-07289270349854b7edd305d02174070b9dc9438d-windows-x64
          run-id: 45959822577
          github-token: ${{ github.token }}
          path: candidate
      - name: Check exact executable identity
        working-directory: candidate
        run: |
          echo '18cb86799b04a0fc2f211dcdeb95da5419765e5060d07503e2879a36dae76fcb  still-desktop.exe' | sha256sum -c -
          sha256sum still-desktop.exe > still-desktop.exe.sha256
      - name: Publish testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2372-workbench.2 \
            --repo grumpchen/Still \
            --target 07289270349854b7edd305d02174070b9dc9438d \
            --title 'Still Workbench 测试版 2' \
            --prerelease --latest=false \
            --notes-file docs/release-notes/workbench-preview-2.md \
            candidate/still-desktop.exe candidate/still-desktop.exe.sha256
