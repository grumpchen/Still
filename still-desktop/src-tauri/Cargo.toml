[package]
name = "still-desktop"
version = "0.20.0"
description = "Personal workspace with compact movable widgets and real Chrome"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
ring = "0.17.14"
jsonwebtoken = "=9.3.1"
tokio = { version = "1", features = ["io-util", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
image = { version = "0.25", default-features = false, features = ["png"] }
pdf-extract = "=0.12.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Security_Credentials", "Win32_Security_Cryptography"] }
arboard = "3.6"
winreg = "0.55"
